name: InfraCore Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  security-events: write
  contents: read

env:
  INFRACORE_PATH: RallTheoryGroup/src/managed-it/infracore

jobs:
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t infracore:${{ github.sha }} .
        working-directory: ${{ env.INFRACORE_PATH }}/docker

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.1
          scanners: vuln
          limit-severities-for-sarif: true
          image-ref: infracore:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: 'trivy-container'

      - name: Upload image scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.sarif
          retention-days: 30

      - name: Generate SBOM for the scanned image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.1
          image-ref: infracore:${{ github.sha }}
          format: spdx-json
          output: sbom-spdx.json
          exit-code: '0'
      - name: Generate CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.1
          image-ref: infracore:${{ github.sha }}
          format: cyclonedx
          output: sbom-cyclonedx.json
          exit-code: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infracore-sbom
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          if-no-files-found: error
          retention-days: 30

  bicep-scan:
    name: Bicep IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov==3.2.495

      - name: Validate Bicep syntax
        run: az bicep build --file main.bicep
        working-directory: ${{ env.INFRACORE_PATH }}/bicep

      - name: Checkov Bicep scan
        id: checkov-bicep
        run: |
          checkov -f main.json --framework arm \
            --check CKV_AZURE_3,CKV_AZURE_35,CKV_AZURE_44,CKV_AZURE_59 \
            --output cli --output sarif --output json --output-file-path console,results_sarif.sarif,results_json.json
        working-directory: ${{ env.INFRACORE_PATH }}/bicep

      - name: Reject empty or incomplete ARM policy evaluation
        run: jq -e '.summary.passed == 4 and .summary.failed == 0 and .summary.skipped == 0 and .summary.parsing_errors == 0' results_json.json
        working-directory: ${{ env.INFRACORE_PATH }}/bicep

      - name: Upload Bicep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.INFRACORE_PATH }}/bicep/results_sarif.sarif
          category: infracore-arm

      - name: Upload Bicep scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-bicep-report
          path: ${{ env.INFRACORE_PATH }}/bicep/results_sarif.sarif
          retention-days: 30

  terraform-scan:
    name: Terraform IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov==3.2.495

      - name: Checkov Terraform scan
        id: checkov-tf
        run: |
          checkov -d . \
            --framework terraform \
            --check CKV_AZURE_3,CKV_AZURE_35,CKV_AZURE_44,CKV_AZURE_59 \
            --output cli --output sarif --output json --output-file-path console,results_sarif.sarif,results_json.json
        working-directory: ${{ env.INFRACORE_PATH }}/terraform

      - name: Reject empty or incomplete Terraform policy evaluation
        run: jq -e '.summary.passed == 4 and .summary.failed == 0 and .summary.skipped == 0 and .summary.parsing_errors == 0' results_json.json
        working-directory: ${{ env.INFRACORE_PATH }}/terraform

      - name: Upload Terraform SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.INFRACORE_PATH }}/terraform/results_sarif.sarif
          category: infracore-terraform

      - name: Upload Terraform scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: ${{ env.INFRACORE_PATH }}/terraform/results_sarif.sarif
          retention-days: 30

  quality-gate:
    name: InfraCore Security Quality Gate
    runs-on: ubuntu-latest
    needs: [container-scan, bicep-scan, terraform-scan]
    if: always()
    steps:
      - name: Evaluate all scan results
        run: |
          FAILED=false

          if [ "${{ needs.container-scan.result }}" != "success" ]; then
            echo "::error::Container scan found HIGH/CRITICAL vulnerabilities"
            FAILED=true
          fi

          if [ "${{ needs.bicep-scan.result }}" != "success" ]; then
            echo "::error::Bicep scan found security misconfigurations"
            FAILED=true
          fi

          if [ "${{ needs.terraform-scan.result }}" != "success" ]; then
            echo "::error::Terraform scan found security misconfigurations"
            FAILED=true
          fi

          if [ "$FAILED" == "true" ]; then
            echo ""
            echo "=========================================="
            echo " SECURITY QUALITY GATE: FAILED"
            echo "=========================================="
            echo "Review scan artifacts and fix findings before merging."
            exit 1
          fi

          echo "=========================================="
          echo " SECURITY QUALITY GATE: PASSED"
          echo "=========================================="
